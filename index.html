<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>考勤系统登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 340px;
            box-shadow: 0 2px 10px #00000022;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
        }
        .item {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: #1677ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0d5ecd;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>考勤登录</h2>
        <form action="CheckLogin" method="post">
            <div class="item">
                <label>账号</label>
                <input type="text" name="username" required>
            </div>
            <div class="item">
                <label>密码</label>
                <input type="password" name="pwd" required>
            </div>
            <button type="submit">登录</button>
        </form>
    </div>
</body>
</html>
